name: CI

on:
  # Use pull_request, not pull_request_target, so forked PRs stay subject to
  # GitHub's normal external-contributor approval gate and receive no secrets.
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-unit:
    name: Static checks and unit tests
    runs-on: blacksmith-4vcpu-ubuntu-2204-arm
    timeout-minutes: 15
    env:
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/.pycache

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install TypeScript dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck TypeScript
        run: bun run typecheck

      - name: Lint TypeScript
        run: bun run lint

      - name: Run TypeScript unit tests
        run: bun run test

      - name: Compile Python modules
        run: python3 -m compileall proxy

      - name: Run Python unit tests
        run: python3 -m unittest discover -s proxy -p 'test_*.py'

  nix-linux:
    name: Nix Linux build
    runs-on: blacksmith-4vcpu-ubuntu-2204-arm
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ''

      - name: Evaluate flake outputs
        run: |
          nix eval --raw .#nixosConfigurations.agent-vm.config.system.build.toplevel.drvPath
          nix eval --raw .#nixosConfigurations.firewall-vm.config.system.build.toplevel.drvPath
          nix eval --raw .#homeConfigurations.luser.activationPackage.drvPath

      - name: Build Linux VM and Home Manager closures
        run: |
          nix build --print-build-logs \
            .#nixosConfigurations.agent-vm.config.system.build.toplevel \
            .#nixosConfigurations.firewall-vm.config.system.build.toplevel \
            .#homeConfigurations.luser.activationPackage
